name: Update Scores

on:
  # PAUSAD 2026-08-25: schemat är avstängt tills vidare. Kör manuellt via workflow_dispatch.
  # schedule:
  #   # Kör var 30:e minut under WSOP-tid (18:00–11:00 UTC = 20:00–13:00 svensk tid)
  #   - cron: '0,30 18-23 * * *'
  #   - cron: '0,30 0-11 * * *'
  workflow_dispatch:

# Workflowen behöver bara läsa koden (den skriver till Firestore, inte till repot)
permissions:
  contents: read

# Bara en körning åt gången. Trycker flera på "Uppdatera" samtidigt köas
# en körning i stället för att alla startar parallellt.
concurrency:
  group: update-scores
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 firebase-admin

      - name: Scrape and write to Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python scrape_scores.py

      - name: Fetch PokerNews live status
        # Körs även om poängsteget ovan misslyckades, så live-fliken uppdateras ändå
        if: ${{ !cancelled() }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          POKERNEWS_COOKIES: ${{ secrets.POKERNEWS_COOKIES }}
        run: python scrape_pokernews.py


